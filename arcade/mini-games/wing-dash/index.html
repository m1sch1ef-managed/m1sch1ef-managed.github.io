<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wing Dash</title><link rel="stylesheet" href="../common.css"></head><body><main><header><div><h1>Wing Dash</h1><p>One tap. One wingbeat. One more narrow escape.</p></div><button id="sound">Sound on</button></header><div class="hud"><span>GATES <strong id="score">0</strong></span><span>BEST <strong id="best">0</strong></span><span>SPEED <strong id="speed">1×</strong></span></div><div class="stage" style="--canvas-width:800px;--canvas-ratio:1.6666667"><canvas id="game" width="800" height="480" aria-label="Flying obstacle game"></canvas><div class="overlay" id="overlay"><h2 id="heading">Wing Dash</h2><p id="message">Tap, click, or press Space to flap through the gates. Time your wingbeats to stay in the gap.</p><button class="primary" id="start">Play game</button></div></div><div class="actions"><button id="pause">Pause</button><button id="restart">New game</button></div><p class="hint">Flap: <kbd>Space</kbd>, click, or tap · Pause: <kbd>P</kbd></p></main><script src="../common.js"></script><script src="../leaderboard.js"></script><script src="game.js"></script></body></html>
